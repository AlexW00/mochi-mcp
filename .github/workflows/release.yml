name: Release

# Every change to main that affects the image produces a new release:
# tests -> next semver tag -> multi-arch image on GHCR -> GitHub release.
#
# Merges performed by GitHub's auto-merge bot (Dependabot) do not trigger push
# workflows, so a daily schedule releases any unreleased changes as well.
# Manual runs can choose the bump level.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increase
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          EVENT: ${{ github.event_name }}
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            last=v0.0.0
            changed=yes
          elif git tag --points-at HEAD | grep -qx "$last"; then
            changed=no
          else
            # Documentation and repository metadata do not change the image.
            changed=$(git diff --name-only "$last" HEAD -- . \
              ':(exclude)*.md' ':(exclude)LICENSE' ':(exclude).github/dependabot.yml' \
              | grep -q . && echo yes || echo no)
          fi
          if [ "$changed" = no ] && [ "$EVENT" != workflow_dispatch ]; then
            echo "No image-relevant changes since $last."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          echo "Releasing $version (previous $last)."
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: [plan, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/mochi-mcp
          tags: |
            type=semver,pattern={{version}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}},value=v${{ env.VERSION }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=mochi-mcp
            org.opencontainers.image.description=Rate-limit-aware MCP server for Mochi Cards
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Build and push linux/amd64 and linux/arm64
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ env.VERSION }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the published image
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/mochi-mcp@${DIGEST}"
          docker run -d --name smoke -p 8000:8000 \
            -e MOCHI_API_KEY=placeholder \
            -e MCP_PUBLIC_URL=https://mochi.validation.invalid \
            -e MCP_AUTH_SECRET="$(openssl rand -hex 24)" "$image"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/healthz | grep -q "\"version\":\"${VERSION}\""
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp -H 'content-type: application/json' -d '{}')" = 401
          docker rm -f smoke
      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          pin="ghcr.io/${owner}/mochi-mcp:${VERSION}@${DIGEST}"
          fence='```'
          printf 'Image:\n\n%s\n%s\n%s\n' "$fence" "$pin" "$fence" > notes.md
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v${VERSION}" --notes-file notes.md --generate-notes
          printf '### Published\n\n%s\n%s\n%s\n' "$fence" "$pin" "$fence" >> "$GITHUB_STEP_SUMMARY"
